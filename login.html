<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPresence Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #1a1a2e;
            font-size: 24px;
        }

        .logo p {
            color: #666;
            font-size: 13px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #1a1a2e;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1a1a2e;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #16213e;
        }

        .error {
            background: #fee;
            color: #c00;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
            text-align: center;
        }

        .hint {
            margin-top: 20px;
            padding: 12px;
            background: #f0f4ff;
            border-radius: 6px;
            font-size: 12px;
            color: #555;
        }

        .hint p {
            margin: 2px 0;
        }
    </style>
</head>
<body>

<div class="login-box">
    <div class="logo">
        <h1> SmartPresence</h1>
        <p>RFID + Face Recognition Exam System</p>
        <p>IIT Indore</p>
    </div>

    {% if error %}
    <div class="error"> {{ error }}</div>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label>Username</label>
            <input 
                type="text" 
                name="username" 
                placeholder="Enter username"
                required
                autofocus>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input 
                type="password" 
                name="password" 
                placeholder="Enter password"
                required>
        </div>

        <button type="submit">Login →</button>
    </form>

    <!-- Development hints — real deployment mein remove karna -->
    <div class="hint">
        <p> Room 1: teacher1 / pass1</p>
        <p> Room 2: teacher2 / pass2</p>
        <p> Room 3: teacher3 / pass3</p>
        <p> Room 4: teacher4 / pass4</p>
    </div>
</div>

</body>
</html>
